<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Financing Capability Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8fafc; --ink:#14213d; --ink-2:#44516a; --muted:#69758a; --line:#dce2ea; --line-2:#c7d0dc;
  --accent:#1f3864; --accent-soft:#e7ecf5; --on-accent:#ffffff;
  --h0:#eef1f5; --h1:#cde2fb; --h2:#86b6ef; --h3:#2a78d6; --h3-ink:#ffffff;
  --shadow:0 1px 2px rgba(20,33,61,.06);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1420; --surface:#162033; --surface-2:#1a263b; --ink:#e9eef6; --ink-2:#b7c2d3; --muted:#8a97ab; --line:#27344b; --line-2:#34435d;
    --accent:#a9c1ec; --accent-soft:#1e2c45; --on-accent:#0d1420;
    --h0:#1c283c; --h1:#104281; --h2:#256abf; --h3:#6da7ec; --h3-ink:#0d1420;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#162033; --surface-2:#1a263b; --ink:#e9eef6; --ink-2:#b7c2d3; --muted:#8a97ab; --line:#27344b; --line-2:#34435d;
  --accent:#a9c1ec; --accent-soft:#1e2c45; --on-accent:#0d1420;
  --h0:#1c283c; --h1:#104281; --h2:#256abf; --h3:#6da7ec; --h3-ink:#0d1420;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.005em;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;min-height:56px}
.brand{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -8px;padding:0 8px;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:17px 10px 15px;border-bottom:2px solid transparent;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
@media (max-width:760px){.top .wrap{flex-direction:column;align-items:flex-start;gap:0;padding-top:10px}.nav{width:100%}.nav a{padding:10px 10px 10px}}

main{padding:36px 0 72px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(28px,4.2vw,40px);line-height:1.12;margin:8px 0 10px;max-width:26ch}
.hero .by{color:var(--ink-2);max-width:70ch}
.view-head{margin-bottom:22px}
.view-head h1{font-size:clamp(24px,3.4vw,32px);line-height:1.15;margin:6px 0 8px}
.view-head p{color:var(--ink-2);max-width:78ch}
section{margin-top:44px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:21px}
.sec-head .more{font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.sec-head .more:hover{text-decoration:underline}
.sec-note{color:var(--muted);font-size:13.5px;margin-top:10px;max-width:90ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:460px){.g4{grid-template-columns:minmax(0,1fr)}}

/* bottom line */
.bl{margin-top:28px;border-top:2px solid var(--accent)}
.bl-item{display:grid;grid-template-columns:44px 1fr;gap:4px 8px;padding:18px 0;border-bottom:1px solid var(--line);align-content:start}
.bl-n{font-family:var(--serif);font-size:26px;line-height:1;color:var(--accent);font-weight:600;padding-top:2px}
.bl-item h3{font-size:19px;line-height:1.25}
.bl-item p{grid-column:2;color:var(--ink-2);max-width:86ch}
@media (min-width:900px){.bl{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}}

/* tiles */
.tile{padding:16px 18px 14px}
.tile .lab{font-size:13px;color:var(--ink-2);font-weight:500}
.tile .val{font-size:32px;font-weight:600;line-height:1.15;margin:4px 0 2px;letter-spacing:-.01em}
.tile .ctx{font-size:13.5px;color:var(--ink-2)}
.tile .src{font-size:12px;color:var(--muted);margin-top:8px}
.date{padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:center}
.date .n{font-size:28px;font-weight:600;line-height:1.1;grid-row:1 / span 2;min-width:3.2ch;text-align:right}
.date .n small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.date .d{font-weight:600}
.date .w{font-size:13.5px;color:var(--ink-2)}

/* peer charts */
.peer{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px}
@media (max-width:980px){.peer{grid-template-columns:minmax(0,1fr)}}
.charts{padding:18px 20px 16px}
.legend{display:flex;gap:18px;font-size:13px;color:var(--ink-2);margin-bottom:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 28px}
@media (max-width:600px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel h3{font-family:var(--sans);font-size:13.5px;font-weight:600;margin-bottom:8px}
.panel h3 span{font-weight:400;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:108px 1fr;align-items:center;gap:8px;height:28px;border-radius:4px;outline:none}
.bar-row:hover,.bar-row:focus-visible{background:var(--surface-2)}
.bar-row .bl-lab{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row.me .bl-lab{color:var(--ink);font-weight:600}
.bar-track{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line-2);height:100%}
.bar{height:16px;border-radius:0 4px 4px 0;background:var(--peer);min-width:2px}

.bar-val{font-size:13px;color:var(--ink);font-weight:500;white-space:nowrap}
.bar-row.me .bar-val{font-weight:700}
.read{padding:18px 20px}
.read h3{font-size:17px;margin-bottom:8px}
.read ul{margin:0;padding:0;list-style:none}
.read li{padding:10px 0;border-top:1px solid var(--line);color:var(--ink-2);font-size:14.5px}
.read li:first-child{border-top:0;padding-top:2px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:6px;max-width:260px;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip b{font-weight:600}

/* tables */
details.fold{margin-top:14px}
details.fold>summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"+";display:inline-block;width:1em;font-weight:500}
details.fold[open]>summary::before{content:"–"}
.tbl-wrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;white-space:nowrap;background:var(--surface-2)}
td.num,th.num{text-align:right;white-space:nowrap}
td.me{font-weight:600}
tr:last-child td{border-bottom:0}

/* persona cards */
.persona{padding:18px 20px;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:border-color .12s}
.persona:hover{border-color:var(--accent)}
.persona h3{font-size:18px;margin:4px 0 4px}
.persona .q{color:var(--ink-2);font-size:14.5px;font-style:italic;font-family:var(--serif)}
.persona ul{margin:12px 0 14px;padding:0;list-style:none;font-size:14px}
.persona li{padding:6px 0;border-top:1px solid var(--line);color:var(--ink)}
.persona .go{margin-top:auto;font-weight:600;font-size:14px;color:var(--accent)}

/* heat */
.heat{display:inline-flex;gap:3px}
.hc{width:26px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--ink)}
.hc.v0{background:var(--h0);color:var(--muted)}.hc.v1{background:var(--h1)}.hc.v2{background:var(--h2)}.hc.v3{background:var(--h3);color:var(--h3-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hc.v1,:root:not([data-theme="light"]) .hc.v2{color:#e9eef6}}
:root[data-theme="dark"] .hc.v1,:root[data-theme="dark"] .hc.v2{color:#e9eef6}
.tot{font-weight:700;min-width:2ch;text-align:right;display:inline-block}
.scale{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);align-items:center}
.scale span{display:inline-flex;align-items:center;gap:6px}

/* rows (details lists) */
.list{overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>summary{list-style:none;cursor:pointer;display:grid;gap:6px 16px;padding:13px 18px;align-items:start}
.row>summary::-webkit-details-marker{display:none}
.row>summary:hover{background:var(--surface-2)}
.row[open]>summary{background:var(--surface-2)}
.row .id{font-size:12.5px;color:var(--muted);font-weight:600;padding-top:2px}
.row .nm{font-weight:600}
.row .sub{color:var(--ink-2);font-size:13.5px;margin-top:1px}
.row .body{padding:6px 18px 18px;display:grid;gap:14px 28px;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface-2)}
@media (max-width:760px){.row .body{grid-template-columns:minmax(0,1fr)}}
.row .body .full{grid-column:1 / -1}
.k{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.v{color:var(--ink);font-size:14.5px}
.cap-sum{grid-template-columns:44px minmax(0,1fr) auto 28px}
.kpi-sum{grid-template-columns:38px minmax(0,1.1fr) 92px minmax(0,1.4fr)}
@media (max-width:760px){.kpi-sum{grid-template-columns:38px minmax(0,1fr) auto}.kpi-sum .ref{grid-column:2 / -1}}
.ref{color:var(--ink-2);font-size:13.5px}
.dir{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;padding-top:2px}
.group-h{padding:10px 18px 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}
.group-h:first-child{border-top:0}
.cols-h{display:grid;gap:6px 16px;padding:9px 18px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
@media (max-width:760px){.cols-h.kpi-sum span:nth-child(4){display:none}}

/* chips and controls */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:12.5px;line-height:1.3;padding:4px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink);text-decoration:none;background:var(--surface)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip b{font-weight:600;color:var(--muted);margin-right:4px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:4px;white-space:nowrap}
.tag.Stability{background:var(--accent);color:var(--on-accent)}
.tag.Innovation{border:1px solid var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border:0;background:none;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button:focus-visible,.row>summary:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;gap:12px 16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.controls label{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%}
select{font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);max-width:100%;min-width:0;flex:0 1 auto;text-overflow:ellipsis}

/* opportunities board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:980px){.board{grid-template-columns:minmax(0,1fr)}}
.col-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 8px;border-bottom:2px solid var(--accent);margin-bottom:10px}
.col-h h2{font-size:18px}
.col-h span{font-size:13px;color:var(--muted)}
.opp{margin-bottom:10px}
.opp>summary{list-style:none;cursor:pointer;padding:13px 16px}
.opp>summary::-webkit-details-marker{display:none}
.opp .top-l{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.opp .top-l .id{font-size:12.5px;color:var(--muted);font-weight:600}
.opp .nm{font-weight:600;line-height:1.3}
.opp .sub{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.opp .body{padding:2px 16px 16px;display:grid;gap:12px}
.empty{color:var(--muted);font-size:13.5px;padding:8px 2px}

.matrix td,.matrix th{text-align:center;padding:12px}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix a{font-size:24px;font-weight:600;text-decoration:none;color:var(--ink)}
.matrix a:hover{color:var(--accent)}
.matrix th small{display:block;font-weight:400;letter-spacing:0;color:var(--muted)}

.quote{font-family:var(--serif);font-size:16.5px;line-height:1.4;color:var(--ink);border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.note{background:var(--accent-soft);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--ink);max-width:none}
.src-list{columns:2;column-gap:36px;margin:0;padding:0;list-style:none;font-size:14px}
.src-list li{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){.src-list{columns:1}}
footer{border-top:1px solid var(--line);padding:20px 0 40px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.tip{transition:none}}

/* domain cards */
.dcard{overflow:hidden;margin-bottom:18px}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px 32px;padding:20px 22px;border-bottom:1px solid var(--line);align-items:start}
@media (max-width:860px){.dhead{grid-template-columns:minmax(0,1fr)}}
.dhead h2{font-size:22px;line-height:1.2;margin:5px 0 6px}
.dhead .sum{color:var(--ink-2);font-size:14.5px;max-width:46ch}
.dhead .meta{font-size:12.5px;color:var(--muted);margin-top:8px}
.kpi{background:var(--accent-soft);border-radius:8px;padding:13px 16px 12px}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kpi-n{font-weight:700;font-size:17px;line-height:1.25;margin-top:1px}
.dirchip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);white-space:nowrap}
.kpi-w{font-size:13.5px;color:var(--ink);margin-top:8px}
.cad{color:var(--ink-2)}
.kpi-r{font-size:12.5px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.kpi-r b{color:var(--ink);font-weight:600}
.kpi-r .ar{color:var(--muted)}
.caps{min-width:0}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 22px}
span.chip{color:var(--ink-2)}
.scale-h{font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.scale-h b{color:var(--ink)}
@media (max-width:600px){.row>summary.cap-sum,.cols-h.cap-sum{grid-template-columns:28px minmax(0,1fr) auto 16px;gap:6px 10px;padding-left:14px;padding-right:14px}.row .body{padding-left:14px;padding-right:14px}.dhead{padding:16px 14px}}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <a class="brand" href="#/capabilities">Financing Capability Map</a>
  <nav class="nav" aria-label="Sections">
    <a href="#/capabilities" data-nav="capabilities">Capabilities</a>
    <a href="#/opportunities" data-nav="opportunities">Opportunities</a>
  </nav>
</div></header>
<main><div class="wrap" id="app"></div></main>

to ledgers belongs in the target architecture, not bolted on later.",2],["Mandate and T+1 dates set the sequence.",2]],"kpis":["Efficiency","Legacy retired and volume on target platforms","Run versus change, and cost per trade"]},{"id":"8.4","dom":"Engineering leadership & AI engineering","name":"Team, talent and vendors","what":"The global team, hiring, role-model engineering culture, vendor and partner teams.","why":"The senior engineers are the scarce resource; the team sets the pace of everything else.","lens":[["Roles shift toward engineers who direct agents.",2],["Ledger engineering skills are scarce in the team.",1],["An always-on support model.",1]],"kpis":["Run versus change, and cost per trade","Team health"]},{"id":"8.5","dom":"Engineering leadership & AI engineering","name":"AI in the financing business: decision and execution intelligence","what":"AI applied to the business itself, beyond the SDLC: fail and short-cover prediction, extraction of eligibility schedules and agreements, pricing and availability models, operations agents for breaks and repairs, read-only desk and client assistants.","why":"Two tracks with two control paths: decisions (optimizer, predictors — models under SR 26-2) and execution (agents under the bank's own AI governance). Financing-specific use is open ground at banks.","lens":[["The capability itself.",3],["Agents acting on ledgers need identity and limits; no public example joins the two yet.",1],["Intraday decisions outrun people; automation within limits.",1]],"kpis":["AI in production on financing data"]},{"id":"8.6","dom":"Engineering leadership & AI engineering","name":"Technology strategy across the three vectors","what":"Joining AI, tokenization and new instruments into one architecture: real-time inventory including on-ledger positions, eligibility and agreements as data, event-driven processing without a single end-of-day, agents within limits, one control map.","why":"The three are funded and governed separately but land on the same platforms, so the modernization sequence has to serve all three.","lens":[["Decision and execution intelligence on every platform.",3],["Ledgers as venues, locations and records.",3],["Instruments, hours and mandates that set the dates.",3]],"kpis":["Technology position against peers"]},{"id":"9.1","dom":"Market structure, competitors & change","name":"Market infrastructure and vendors","what":"FICC, CME, LCH, Eurex, tri-party agents, ICSDs, matching and reporting vendors, optimization vendors, e-trading venues, tokenized repo and collateral platforms.","why":"The estate connects to all of these; each is a dependency and a choice between building, buying and connecting.","lens":[["Vendors expose agent endpoints and operations agents.",1],["Tokenized repo platforms, collateral ledgers, the depository's service, multi-ledger optimizers.",3],["Two new Treasury clearing houses.",2]],"kpis":[]},{"id":"9.2","dom":"Market structure, competitors & change","name":"Competitors' offerings and client needs","what":"How peer banks package financing (sponsored repo, agency lending, prime), what hedge funds, asset managers, sovereigns and MMFs ask for.","why":"What competitors offer and what clients ask for set the bar for the platforms.","lens":[["Read-only client assistants appear.",1],["Peers run their own ledgers and deposit tokens.",3],["Sponsored repo and intraday products as client offers.",2]],"kpis":["Share of wallet and rank with priority clients","Return on balance sheet by client and trade"]},{"id":"9.3","dom":"Market structure, competitors & change","name":"Regulatory change pipeline","what":"Treasury clearing mandate (31 December 2026 cash, 30 June 2027 repo), UK Basel 3.1 (January 2027) and the US endgame re-proposal, UK and EU T+1 (11 October 2027), SEC loan reporting (now 2028), CSDR refit, stablecoin and tokenization rules, FCA and PRA change.","why":"The change pipeline is the book of work; the platforms' design must anticipate it.","lens":[["SR 26-2, EU AI Act timing, supervisory toolkits.",1],["Stablecoin rules, securities and derivatives regulators' positions, UK sandbox, Basel review.",2],["Clearing mandate, T+1, endgame, leverage ratio.",3]],"kpis":["Readiness for dated market change"]},{"id":"9.4","dom":"Market structure, competitors & change","name":"Market dynamics","what":"Repo rates (SOFR, SONIA, €STR), specials, Treasury supply, central-bank facilities (SRF, ON RRP), quarter-end dynamics, the basis trade.","why":"What the desk talks about at 07:30; without it the technology conversation is deaf.","lens":[["Morning-note synthesis.",1],["Tokenized repo volumes are now published data.",1],["Reserves, standing facilities, issuance, quarter-end.",3]],"kpis":["Funding cost and term profile"]},{"id":"10.1","dom":"Digital assets, tokenization & new instruments","name":"Tokenized collateral and on-ledger repo","what":"Repo and collateral movements recorded and settled on distributed ledgers: tokenized repo platforms, bank-run ledgers, collateral ledgers, industry financing trials, the depository's tokenization service.","why":"A new settlement venue and inventory location for the platforms: about $350bn a day on one platform (August 2026), yet concentrated in two pools.","lens":[["Optimizing across on-ledger and off-ledger pools.",1],["The capability itself.",3],["Intraday repo is its main product.",2]],"kpis":["Technology position against peers","Connectivity to new venues"]},{"id":"10.2","dom":"Digital assets, tokenization & new instruments","name":"Tokenized cash: deposit tokens, stablecoins and central-bank money on ledger","what":"The cash leg in digital form: bank deposit tokens, payment stablecoins under the GENIUS Act, central-bank money made usable on ledgers, shared payment ledgers.","why":"Settling repo and margin outside banking hours depends on it. Several banks already run tokenized-deposit services for payments and liquidity.","lens":[["Liquidity forecasting for cash that moves around the clock.",1],["The capability itself.",3],["Stablecoin rules; central-bank money on ledger.",2]],"kpis":["Connectivity to new venues"]},{"id":"10.3","dom":"Digital assets, tokenization & new instruments","name":"Tokenized funds and digital bonds as collateral","what":"Tokenized money-market-fund shares, tokenized Treasuries and natively digital bonds used as margin and repo collateral; acceptance by clearing houses, tri-party agents, central banks and counterparties.","why":"New rows in every eligibility schedule and in the security master. Small today ($14.8bn of tokenized Treasury and money-market products) but aimed at margin.","lens":[["Extraction of fund and bond terms into eligibility data.",1],["The capability itself.",3],["Non-cash margin; central-bank eligibility; the digital gilt.",3]],"kpis":[]},{"id":"10.4","dom":"Digital assets, tokenization & new instruments","name":"Intraday and always-on liquidity","what":"Funding and collateral by the hour and minute: intraday repo, timed settlement, 24x5 clearing and 23x5 trading, longer RTGS and Fedwire hours, intraday liquidity buffers and their cost.","why":"Where tokenization is expected to pay first: the Treasury committee puts intraday liquidity needs near $1.2tn. Platforms built around end-of-day cannot price or book it.","lens":[["Intraday forecasting; funding decisions automated within limits.",2],["Tokenized cash and collateral make minute-level funding practical.",2],["The capability itself.",3]],"kpis":["Intraday liquidity usage","Batch and cut-off performance","Always-on readiness"]},{"id":"10.5","dom":"Digital assets, tokenization & new instruments","name":"DLT platform engineering and interoperability","what":"Building on and connecting to ledgers: contract languages and networks, smart-contract design and change control, key and wallet management, privacy, bringing on-ledger events into the event stream and the position engines.","why":"The hands-on bar, extended: a ledger is a new kind of system of record beside the in-memory grids, with its own failure modes.","lens":[["AI-assisted testing and review of contract code.",1],["The capability itself.",3],["New instruments arrive as contracts to integrate.",1]],"kpis":[]},{"id":"10.6","dom":"Digital assets, tokenization & new instruments","name":"Legal, regulatory and prudential treatment of digital assets","what":"How tokenized securities, tokenized cash and crypto-linked collateral are treated: securities law, custody and client-asset rules, capital and liquidity treatment, master-agreement annexes, new product approval.","why":"Decides what the desk may accept and at what cost. 'Same asset, same treatment' is the working rule in the US, but the detail differs by form: native, mirror or entitlement.","lens":[["Tracking rule changes across jurisdictions.",1],["The capability itself.",3],["Each instrument needs its own treatment answer.",2]],"kpis":[]}],"opps":[{"id":"S1","type":"Stability","title":"Position-engine recovery and peak headroom","what":"Measure and shorten the time to rebuild the in-memory position store after losing a node or a site, and test it at year-end volumes.","why":"In estates built on in-memory grids, recovery and peak volumes are usually where the pain is. To confirm.","caps":["7.3","7.6","3.1"],"lever":"Resilience","hz":"Now","kpis":["Recovery of the position engine","Peak performance and headroom","Availability of critical services"],"proof":"A recovery test at peak volume, signed off by the engineers."},{"id":"S2","type":"Stability","title":"Service-level objectives and a published baseline","what":"Set objectives and error budgets for booking, settlement, inventory and optimization, and publish delivery and reliability measures monthly.","why":"Clients choose financing providers on reliability; a baseline is the first thing to publish.","caps":["7.6","8.1"],"lever":"Resilience","hz":"Now","kpis":["Availability of critical services","Major incidents and time to restore","Deployment frequency and lead time","Change failure rate"],"proof":"A baseline published in week 3 and every month after."},{"id":"S3","type":"Stability","title":"Remove end-of-day dependencies","what":"Map batch jobs and date rolls, and remove the ones that stop the estate running through the night.","why":"Clearing runs 24x5 already; 23x5 trading starts in December 2026; payment hours lengthen in 2027.","caps":["10.4","7.6","7.1"],"lever":"Resilience","hz":"Next","kpis":["Batch and cut-off performance","Always-on readiness"],"proof":"A batch-dependency map with the three that block overnight running."},{"id":"S4","type":"Stability","title":"Consolidate settlement adapters","what":"One internal instruction model with a thin adapter per agent, depository and venue.","why":"Each bespoke adapter is a slow, risky release, and new venues are arriving.","caps":["7.2","2.4"],"lever":"Engineering","hz":"Next","kpis":["Straight-through processing","Fails caused by data or technology","Settlement fails and their cost"],"proof":"An adapter inventory with failure history and the first two to merge."},{"id":"S5","type":"Stability","title":"Close the loop on fails","what":"Feed fail causes and their cost back to booking and to the upkeep of settlement instructions.","why":"Fails usually cluster on a few counterparties and data errors, and the cost is rarely fed back to where the data is kept. To confirm here.","caps":["2.4","3.3","7.5"],"lever":"Data","hz":"Now","kpis":["Settlement fails and their cost","Cost of failure","Fails caused by data or technology"],"proof":"A fails Pareto with cost and the three data fixes that remove the most."},{"id":"S6","type":"Stability","title":"Fix repeat breaks at the source","what":"Classify reconciliation breaks by originating feed and event, and fix upstream.","why":"In most estates the same feeds produce the same breaks every day. To confirm here.","caps":["3.4"],"lever":"Data","hz":"Now","kpis":["Breaks and reconciliation"],"proof":"A break taxonomy by source system."},{"id":"S7","type":"Stability","title":"Control evidence from the pipeline","what":"Tests, approvals and audit evidence captured automatically at release.","why":"Audit findings on technology typically concentrate on change and access evidence; automating it speeds delivery too.","caps":["8.1","6.3"],"lever":"Engineering","hz":"Now","kpis":["Automated tests and control evidence","Open audit and security findings","Deployment frequency and lead time"],"proof":"One service releasing with fully automated evidence."},{"id":"S8","type":"Stability","title":"Design the clearing mandate into the platform","what":"Booking, margin and netting that work across several clearing houses, built once.","why":"Cash clearing is due 31 December 2026 and repo 30 June 2027, with two new clearing houses.","caps":["2.3","5.2","7.1"],"lever":"Market structure","hz":"Now","kpis":["Readiness for dated market change","Cleared share and netting efficiency","Connectivity to new venues"],"proof":"An impact map by platform, agreed with the mandate program."},{"id":"S9","type":"Stability","title":"Named owners for reference and agreement data","what":"Golden sources and owners for settlement instructions, agreements and eligibility.","why":"Most fails, disputes and optimizer errors usually trace back to this data.","caps":["7.5","6.4","4.1"],"lever":"Data","hz":"Now","kpis":["Reference and agreement data readiness","Fails caused by data or technology"],"proof":"An entity-to-golden-source map with readiness scores."},{"id":"S10","type":"Stability","title":"Relieve the critical people","what":"Move senior engineers off production support through runbooks, automation and cover.","why":"The engineers modernization needs are usually the ones holding production together. To confirm here.","caps":["8.4","7.6"],"lever":"People","hz":"Next","kpis":["Team health","Run versus change, and cost per trade"],"proof":"A team map with critical-person risk and the first three hires."},{"id":"S11","type":"Stability","title":"Bring the platform up to date","what":"Move runtimes and middleware to supported versions.","why":"Kafka dropped ZooKeeper in 2025, GemFire is subscription-only, and Ignite 2 to 3 is a migration.","caps":["7.3","7.6"],"lever":"Engineering","hz":"Next","kpis":["Technical debt and platform currency"],"proof":"An end-of-support inventory with dates and owners."},{"id":"S12","type":"Stability","title":"Ready for T+1 in the UK and Europe, and for longer hours","what":"Compress financing and settlement timelines ahead of October 2027.","why":"UK, EU and Swiss T+1 goes live on 11 October 2027; industry testing starts in early 2027.","caps":["2.4","7.2","9.3"],"lever":"Market structure","hz":"Next","kpis":["Readiness for dated market change","Batch and cut-off performance"],"proof":"A timeline of what moves earlier in the day, by platform."},{"id":"N1","type":"Innovation","title":"Intraday collateral optimization","what":"Run the optimizer during the day on trusted positions, with what-if for the desk.","why":"Tokenized collateral and intraday repo make continuous optimization worth running; the limit is data timing.","caps":["4.2","7.4","3.1"],"lever":"AI · Tokenization","hz":"Next","kpis":["Collateral efficiency","Inventory put to work","Optimizer cadence"],"proof":"A feasibility assessment extended to one tokenized venue."},{"id":"N2","type":"Innovation","title":"Eligibility and agreements as data","what":"Extract eligibility schedules and agreement terms into the Common Domain Model with language models, reconciled with legal.","why":"Extraction now exceeds 90% accuracy in published tests, and the data model covers eligibility.","caps":["4.1","6.4","7.5"],"lever":"AI","hz":"Now","kpis":["Reference and agreement data readiness","Collateral efficiency","Margin calls and disputes"],"proof":"Ten schedules extracted and reconciled to the engine."},{"id":"N3","type":"Innovation","title":"Predict fails and short covers","what":"A first decision model on inventory data, with a measured outcome.","why":"Infrastructures already run settlement-prediction models up to four days ahead.","caps":["3.3","2.4"],"lever":"AI","hz":"Now","kpis":["Settlement fails and their cost","Cost of failure","AI in production on financing data"],"proof":"A feature list from existing data and a back-test."},{"id":"N4","type":"Innovation","title":"Operations agents with human release","what":"Agents research fails and breaks and propose the repair; a person releases it.","why":"Vendors run this in production; supervisors ask about scope of action and reversibility.","caps":["2.4","3.4","8.5"],"lever":"AI","hz":"Next","kpis":["Breaks and reconciliation","Straight-through processing","AI in production on financing data"],"proof":"Authority tiers agreed with operations and AI governance."},{"id":"N5","type":"Innovation","title":"AI-assisted engineering on the legacy estate","what":"Test generation and code-to-specification on booking and settlement services.","why":"Large banks are rolling coding agents out to their developers; the open question is the measured effect on a legacy Java estate.","caps":["8.2","8.3","7.1"],"lever":"AI","hz":"Now","kpis":["AI-assisted engineering: adoption and effect","Deployment frequency and lead time","Legacy retired and volume on target platforms","Efficiency"],"proof":"One measured pilot on one financing service."},{"id":"N6","type":"Innovation","title":"Balance sheet and liquidity shown before the trade","what":"Leverage, RWA and liquidity-ratio impact computed intraday and shown to the desk.","why":"Capital and leverage rules changed in 2026; capacity is the constraint peers describe.","caps":["5.1","5.2","1.4"],"lever":"Data","hz":"Next","kpis":["Balance sheet used against budget, intraday","Return on balance sheet by client and trade","Balance-sheet and leverage usage against allocation","Revenue per unit of balance sheet and of risk-weighted assets","Return on tangible common equity"],"proof":"One trade's ratio impact traced end to end."},{"id":"N7","type":"Innovation","title":"Intraday repo as a bookable product","what":"Trades with a start time and an end time, priced by time.","why":"Three platforms operate and the market is small today; most booking systems assume a trade lasts at least a day.","caps":["10.4","1.1","7.1","5.3"],"lever":"Instruments","hz":"Next","kpis":["Intraday liquidity usage","Net spread on the book","Funding cost and term profile"],"proof":"A one-page list of what an intraday trade breaks today."},{"id":"N8","type":"Innovation","title":"Connect to one tokenized repo and collateral venue","what":"Treat a ledger as a venue and as a place inventory sits.","why":"About $350bn a day runs on one platform; the US depository's service is in limited production.","caps":["10.1","10.5","3.1"],"lever":"Tokenization","hz":"Next","kpis":["Connectivity to new venues","Inventory put to work","Intraday liquidity usage","Technology position against peers"],"proof":"One tokenized trade traced through every internal system."},{"id":"N9","type":"Innovation","title":"Tokenized cash as the cash leg","what":"Use a tokenized-deposit service for repo or margin cash where permitted.","why":"Tokenized deposits are live at several banks for payments and liquidity; using them as the cash leg of financing is the next step.","caps":["10.2","5.4"],"lever":"Tokenization","hz":"Later","kpis":["Intraday liquidity usage","Connectivity to new venues","Liquidity and funding position"],"proof":"A cash-leg options map: hours, finality, cost, treatment."},{"id":"N10","type":"Innovation","title":"Tokenized funds and digital bonds in eligibility","what":"Accept a tokenized money-market fund and a natively digital bond as collateral.","why":"Regulators accept tokenized funds as margin where rights are equivalent; the euro area accepts digital bonds as collateral.","caps":["10.3","4.1","4.3"],"lever":"Instruments · Tokenization","hz":"Next","kpis":["Collateral efficiency","Margin calls and disputes"],"proof":"A gap list for accepting one tokenized fund."},{"id":"N11","type":"Innovation","title":"One margin and inventory view across prime and fixed-income financing","what":"Cross-product margining and shared inventory across the two financing businesses.","why":"Cross-product margining is a stated investment at large dealers, and prime balances are the fastest-growing part of financing.","caps":["1.5","4.3","3.1"],"lever":"Instruments","hz":"Later","kpis":["Client balances","Financing revenue and growth","Inventory put to work","Counterparty exposure and concentration"],"proof":"A map of where the two stacks share and where they do not."},{"id":"N12","type":"Innovation","title":"Internalize earlier in the day","what":"Predict recalls and availability, and match internally before going to market.","why":"Securities-lending revenue is at a record; internal matching depends on how early availability is known.","caps":["3.2","1.2"],"lever":"AI","hz":"Now","kpis":["Inventory put to work","Specials and client flow capture"],"proof":"One month's internalization rate with the timing gap."},{"id":"N13","type":"Innovation","title":"Platform interfaces that agents and clients can call","what":"Entitled, audited interfaces for agents and for client systems.","why":"Vendors are exposing agent endpoints; the standards moved to neutral governance in 2025–26.","caps":["8.5","7.5","9.2"],"lever":"AI","hz":"Later","kpis":["AI in production on financing data","Specials and client flow capture","Share of wallet and rank with priority clients"],"proof":"A read-only interface on one service with full audit."}],"horizons":{"Now":"First six months","Next":"Six to eighteen months","Later":"Beyond eighteen months"}}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
document.getElementById('asof').textContent = D.asof;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const by = (arr, k) => Object.fromEntries(arr.map(x => [x[k], x]));
const CAP = by(D.caps, 'id'), OPP = by(D.opps, 'id');
D.caps.forEach(c => { c.tot = c.lens[0][1] + c.lens[1][1] + c.lens[2][1]; });
const DIRL = {Higher:'↑ Higher is better', Lower:'↓ Lower is better', 'In range':'↔ Kept in range'};
const DIRS = {Higher:'↑ Higher', Lower:'↓ Lower', 'In range':'↔ In range'};
const LENS = ['AI', 'Ledgers and tokenization', 'Instruments and market structure'];
const SCALE = ['none', 'peripheral', 'material within 24 months', 'reshapes the capability'];
const state = {type:'', lever:''};

const chipCap = id => `<a class="chip" href="#/capabilities/${id}"><b>${id}</b>${esc(CAP[id].name)}</a>`;
const chipOpp = id => `<a class="chip" href="#/opportunities/${id}"><b>${id}</b>${esc(OPP[id].title)}</a>`;
const chipTxt = t => `<span class="chip">${esc(t)}</span>`;
const chips = (xs, f) => xs.length ? `<div class="chips">${xs.map(f).join('')}</div>` : '<span class="ref">None listed</span>';
const block = (k, v, full) => `<div${full ? ' class="full"' : ''}><div class="k">${k}</div><div class="v">${v}</div></div>`;
const heat = c => `<span class="heat" aria-label="AI ${c.lens[0][1]}, ledgers ${c.lens[1][1]}, instruments ${c.lens[2][1]}">${c.lens.map((l, i) => `<span class="hc v${l[1]}" title="${LENS[i]}: ${l[1]} — ${SCALE[l[1]]}">${l[1]}</span>`).join('')}</span>`;

/* ---------- capabilities ---------- */
function capRow(c, open){
  const os = D.opps.filter(o => o.caps.includes(c.id)).map(o => o.id);
  return `<details class="row" id="c-${c.id}"${open ? ' open' : ''}><summary class="cap-sum"><span class="id">${c.id}</span><span class="nm">${esc(c.name)}</span>${heat(c)}<span class="tot">${c.tot}</span></summary>
  <div class="body">${block('What it is', esc(c.what))}${block('Why it matters', esc(c.why))}
  <div class="full grid g3" style="gap:14px 24px">${c.lens.map((l, i) => block(`${LENS[i]} · ${l[1]} of 3`, esc(l[0]))).join('')}</div>
  ${block('Opportunities', chips(os, chipOpp), 1)}${c.kpis.length ? block('KPIs that depend on it', chips(c.kpis, chipTxt), 1) : ''}</div></details>`;
}
function domCard(dm, openId){
  const cs = D.caps.filter(c => c.dom === dm.name);
  const sums = [0, 1, 2].map(i => cs.reduce((a, c) => a + c.lens[i][1], 0));
  const lead = LENS[sums.indexOf(Math.max(...sums))].toLowerCase().replace('ai', 'AI');
  const k = dm.kpi;
  return `<article class="card dcard" id="d-${dm.n}">
    <div class="dhead">
      <div><div class="eyebrow">Domain ${dm.n}</div><h2>${esc(dm.name)}</h2><p class="sum">${esc(dm.sum)}</p>
        <p class="meta">${cs.length} capabilities · change led by ${lead}</p></div>
      <div class="kpi"><div class="kpi-top"><div><div class="k">Key KPI</div><div class="kpi-n">${esc(k.name)}</div></div><span class="dirchip">${DIRL[k.dir]}</span></div>
        <p class="kpi-w">${esc(k.what)} <span class="cad">Reviewed ${esc(k.cadence.toLowerCase())}.</span></p>
        <p class="kpi-r"><b>Public reference.</b> ${esc(dm.ref)}</p>
        <p class="kpi-r"><b>Also watched.</b> ${dm.also.map(a => `${esc(a.name)} <span class="ar">${DIRS[a.dir].split(' ')[0]}</span>`).join(' · ')}</p></div>
    </div>
    <div class="caps"><div class="cols-h cap-sum"><span>#</span><span>Capability</span><span>AI · DLT · Inst</span><span style="text-align:right">/9</span></div>
      ${cs.map(c => capRow(c, c.id === openId)).join('')}</div>
  </article>`;
}
function capabilities(id){
  return `<div class="view-head"><div class="eyebrow">Markets financing technology</div><h1>What a financing platform has to do</h1>
    <p>${D.caps.length} capabilities in ${D.doms.length} domains, from the products on the desk to the technology estate. Each domain carries the KPI it is judged on. Each capability is rated on how much three technology changes will alter it; open one for the detail.</p></div>
  <p class="scale-h">Ratings, left to right: <b>AI</b> · <b>ledgers and tokenization (DLT)</b> · <b>instruments and market structure</b>. The total is out of 9.</p><div class="scale">${SCALE.map((s, i) => `<span><span class="hc v${i}">${i}</span>${s}</span>`).join('')}</div>
  <nav class="jump" aria-label="Domains">${D.doms.map(dm => `<a class="chip" href="#/capabilities/d-${dm.n}"><b>${dm.n}</b>${esc(dm.name)}</a>`).join('')}</nav>
  ${D.doms.map(dm => domCard(dm, id)).join('')}
  <p class="sec-note">KPI values are internal to each institution and are not shown. The public reference gives a sense of scale. Ratings are first judgments, to be corrected by the people who own the books, the queues and the platforms.</p>`;
}

/* ---------- opportunities ---------- */
function oppCard(o, open){
  return `<details class="card opp" id="o-${o.id}"${open ? ' open' : ''}><summary><div class="top-l"><span class="id">${o.id} · ${esc(o.lever)}</span><span class="tag ${o.type}">${o.type}</span></div><div class="nm">${esc(o.title)}</div><div class="sub">${esc(o.what)}</div></summary>
  <div class="body">${block('Why now', esc(o.why))}${block('First proof point', esc(o.proof))}${block('KPIs it moves', chips(o.kpis, chipTxt))}${block('Capabilities', chips(o.caps, chipCap))}</div></details>`;
}
function opportunities(id){
  if (OPP[id]) { if (state.type && OPP[id].type !== state.type) state.type = ''; state.lever = ''; }
  const levers = [...new Set(D.opps.flatMap(o => o.lever.split(' · ')))].sort();
  const os = D.opps.filter(o => (!state.type || o.type === state.type) && (!state.lever || o.lever.split(' · ').includes(state.lever)));
  const n = t => D.opps.filter(o => o.type === t).length;
  return `<div class="view-head"><div class="eyebrow">Opportunities</div><h1>Where stability and innovation can move the numbers</h1>
    <p>${n('Stability')} stability and ${n('Innovation')} innovation opportunities, placed by when they could start. Each names the KPIs it moves and a first proof point.</p></div>
  <p class="note" style="margin-bottom:16px">These are hypotheses, built from public material and experience of platforms like these. Each is to be confirmed or dropped with the desk, operations and the engineers.</p>
  <div class="controls"><div class="seg" role="group" aria-label="Type">${[['', 'All · ' + D.opps.length], ['Stability', 'Stability · ' + n('Stability')], ['Innovation', 'Innovation · ' + n('Innovation')]].map(t => `<button type="button" data-type="${t[0]}" aria-pressed="${state.type === t[0]}">${t[1]}</button>`).join('')}</div>
    <label>Lever <select id="f-lever"><option value="">All levers</option>${levers.map(l => `<option${l === state.lever ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label></div>
  <div class="board">${Object.keys(D.horizons).map(h => { const hs = os.filter(o => o.hz === h);
    return `<div><div class="col-h"><h2>${h}</h2><span>${esc(D.horizons[h])} · ${hs.length}</span></div>${hs.map(o => oppCard(o, o.id === id)).join('') || '<div class="empty">Nothing in this horizon for the current filter.</div>'}</div>`; }).join('')}</div>`;
}

/* ---------- router ---------- */
const VIEWS = {capabilities, opportunities};
function render(scroll){
  const parts = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  const view = VIEWS[parts[0]] ? parts[0] : 'capabilities', id = parts[1] || '';
  app.innerHTML = VIEWS[view](id);
  document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === view ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (scroll === false) return;
  const el = id ? document.getElementById(id.startsWith('d-') ? id : (view === 'capabilities' ? 'c-' : 'o-') + id) : null;
  if (el) { const y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('.top').offsetHeight - 14; window.scrollTo(0, Math.max(0, y)); }
  else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => render());
app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && 'type' in b.dataset) { state.type = b.dataset.type; history.replaceState(null, '', '#/opportunities'); render(false); }
});
app.addEventListener('change', e => {
  if (e.target.id === 'f-lever') { state.lever = e.target.value; history.replaceState(null, '', '#/opportunities'); render(false); }
});
render();
})();
</script>

</body>
